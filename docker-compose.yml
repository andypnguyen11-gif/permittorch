# Local development database. Postgres 17 matches the integration tests
# (Testcontainers postgres:17-alpine) and Railway's managed Postgres major.
services:
  postgres:
    image: postgres:17-alpine
    container_name: permittorch-postgres
    environment:
      POSTGRES_USER: permittorch
      POSTGRES_PASSWORD: permittorch
      POSTGRES_DB: permittorch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U permittorch -d permittorch"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
